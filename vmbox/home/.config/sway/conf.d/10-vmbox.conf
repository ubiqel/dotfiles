#
### Output configuration (guest)
#

    # Single virtual output: pick a random wallpaper from the committed set
    # when the session starts. `exec_always` re-applies the same cached choice
    # after a `swaymsg reload` (also issued by vmbox-sync) instead of re-rolling
    # it, and falls back to a solid colour when the directory is missing.
    exec_always ~/.config/sway/wallpaper

    # Titlebar and border colors come from the shared linux sway core, which
    # includes ~/.cache/sway/theme-colors.conf written by darkman.
