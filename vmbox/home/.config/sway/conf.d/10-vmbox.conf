#
### Output configuration (guest)
#

    # Single virtual output: flat dark background instead of a wallpaper.
    output * bg #1e1e2e solid_color

    # Titlebar and border colors (static; the guest has no darkman). Copied
    # verbatim from the darkman dark-mode output the host generates in
    # ~/.cache/sway/theme-colors.conf.
    client.focused #414141 #414141 #e6e6e6 #414141 #b8b8b8
    client.focused_inactive #343434 #343434 #b8b8b8 #343434 #343434
    client.focused_tab_title #343434 #343434 #8aadf4
    client.unfocused #292929 #292929 #949494 #292929 #292929
    client.urgent #ed8796 #ed8796 #24273a #ed8796 #ed8796
