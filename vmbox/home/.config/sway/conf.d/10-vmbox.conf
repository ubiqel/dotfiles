#
### Output configuration (guest)
#

    # Single virtual output: pick a random wallpaper from the committed set at
    # startup. The image installs five images into this directory.
    set $wallpapers $HOME/Pictures/Wallpapers/Landscape
    output * bg `find $wallpapers -type f | shuf -n 1` fill

    # Titlebar and border colors come from the shared linux sway core, which
    # includes ~/.cache/sway/theme-colors.conf written by darkman.
