# Map stable Waybar monitor roles to physical monitors.
#
# The identity is the "Monitor:" field from `ddcutil detect --brief`, formatted
# as MFG:MODEL:SERIAL. Using the EDID identity (rather than the i2c bus number)
# keeps the mapping correct even when the bus numbering changes between boots.
M1=GBT:M27Q P:23133B000026
M2=XMI:Mi Monitor:7041110045904
