## Keep Bluetooth headsets on the A2DP (output-only) profile.
## Do not auto-switch to HSP/HFP when an application opens a microphone.
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}

monitor.bluez.rules = [
  {
    matches = [
      {
        ## Sony WH-1000XM4
        device.name = "bluez_card.F8_4E_17_4B_C5_1A"
      }
    ]
    actions = {
      update-props = {
        ## a2dp-sink = High Fidelity Playback (A2DP Sink, codec LDAC)
        device.profile = "a2dp-sink"
        ## Bring up A2DP automatically. Without this, a WirePlumber restart
        ## can leave the headset connected in HFP-only (microphone) mode.
        bluez5.auto-connect = [ a2dp_sink ]
      }
    }
  }
]
