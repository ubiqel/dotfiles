dpi-aware=auto
# Launch Terminal=true entries (nvim, htop, btop) here instead of relying on
# $TERMINAL, so the launcher works in any session that has ghostty installed.
terminal=ghostty -e {cmd}
width=70
font=Liga SFMono Nerd Font:weight=bold:size=10
line-height=20
fields=name,generic,comment,categories,filename,keywords
prompt="❯ "
layer=overlay
tabs=4

[colors]
background=282a36fa
selection=3d4474fa
border=fffffffa

[border]
radius=8

[dmenu]
exit-immediately-if-empty=yes
